name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 源码已是 TS，类型检查不产出文件（见 tsconfig.json）
      - run: npm run typecheck

      - run: npm test

      # 确保前端打包脚本可用（产物 dist/ 不入库）
      - run: npm run build:web

      # 确保 TS 能编译成可打包的 JS（发布流程依赖这一步）
      - run: npm run build:electron
